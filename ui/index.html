<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trae / WorkBuddy 签到面板</title>
<style>
  :root{
    --bg:#0f1512; --card:#161d19; --card2:#1c2521; --line:#26332c;
    --fg:#e7f0ea; --dim:#8ea79a; --accent:#22c55e; --accent2:#16a34a;
    --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:26px 20px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(160deg,#16a34a,#22c55e);
    display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;flex:none}
  h1{font-size:19px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .grow{flex:1}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px}
  .card h2{font-size:13px;margin:0 0 14px;font-weight:600;color:var(--dim);letter-spacing:.06em}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
  .row+.row{border-top:1px dashed var(--line)}
  .name{display:flex;align-items:center;gap:9px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:#3d4d45}
  .dot.ok{background:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .dot.no{background:#546357}
  .muted{color:var(--dim);font-size:12.5px}
  .big{font-size:38px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
  .big span{font-size:15px;font-weight:500;color:var(--dim);margin-left:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:5px 10px;
    font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;font-size:13px}
  .chip b{font-weight:600}
  .chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .chip button:hover{color:var(--bad)}
  button.btn{background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:9px;
    padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
  button.btn:hover{border-color:#3a4d43;background:#222c27}
  button.btn.primary{background:linear-gradient(180deg,#22c55e,#16a34a);border-color:#16a34a;color:#06140c;font-weight:600}
  button.btn.primary:hover{filter:brightness(1.08)}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  input[type=time],select{background:var(--card2);border:1px solid var(--line);color:var(--fg);
    border-radius:9px;padding:7px 9px;font-family:inherit;font-size:13px}
  select{cursor:pointer}
  .toggle{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
  .sw{width:44px;height:25px;border-radius:99px;background:#2b3a32;border:1px solid var(--line);
    position:relative;transition:.18s;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
    background:#8ea79a;transition:.18s}
  .sw.on{background:rgba(34,197,94,.28);border-color:var(--accent2)}
  .sw.on::after{left:21px;background:var(--accent)}
  pre.log{background:#0b100e;border:1px solid var(--line);border-radius:10px;padding:12px;
    max-height:230px;overflow:auto;font:12px/1.65 Consolas,"Courier New",monospace;color:#b9cdc2;
    white-space:pre-wrap;word-break:break-all;margin:0}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
    background:#1f2b25;border:1px solid var(--line);border-radius:11px;padding:11px 18px;font-size:13px;
    opacity:0;transition:.25s;pointer-events:none;max-width:80vw;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--accent2)} .toast.bad{border-color:var(--bad)}
  .auth{background:var(--card2);border:1px dashed var(--line);border-radius:11px;padding:13px;margin-top:10px;display:none}
  .auth.show{display:block}
  .auth a{color:var(--accent);word-break:break-all}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #3d4d45;border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✓</div>
    <div>
      <h1>Trae / WorkBuddy 签到面板</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div class="grow"></div>
    <button class="btn" id="btnRefresh">刷新</button>
    <button class="btn primary" id="btnCheckin">立即签到</button>
  </header>

  <div class="grid">
    <div class="card">
      <h2>今日签到状态</h2>
      <div class="row">
        <div class="name"><span class="dot" id="dTrae"></span><b>Trae</b></div>
        <div class="muted" id="sTrae">—</div>
      </div>
      <div class="row">
        <div class="name"><span class="dot" id="dWb"></span><b>WorkBuddy</b></div>
        <div class="muted" id="sWb">—</div>
      </div>
      <div class="row" id="rowStreak" style="display:none">
        <div class="muted">WorkBuddy 连续签到</div>
        <div class="muted" id="sStreak">—</div>
      </div>
    </div>

    <div class="card">
      <h2>累计积分总量</h2>
      <div class="big" id="cTotal">—<span>积分</span></div>
      <div class="row"><div class="muted">WorkBuddy</div><div id="cWb" class="muted">—</div></div>
      <div class="row"><div class="muted">Trae</div><div id="cTrae" class="muted">—</div></div>
      <div class="row"><div class="muted">有记录天数</div><div id="cDays" class="muted">—</div></div>
    </div>

    <div class="card">
      <h2>定时签到时间</h2>
      <div class="chips" id="chips"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="time" id="newTime" value="09:00">
        <button class="btn" id="btnAddTime">添加</button>
        <div class="grow"></div>
        <button class="btn primary" id="btnSaveTime">保存</button>
      </div>
      <div class="muted" style="margin-top:10px" id="schedInfo">—</div>
    </div>

    <div class="card">
      <h2>开机自启动</h2>
      <div class="toggle" id="tgAuto">
        <div class="sw" id="swAuto"></div>
        <div>
          <div><b>开机自动补签</b></div>
          <div class="muted">开机登录 30 秒后自动补签当天未完成的一端</div>
        </div>
      </div>
      <div class="muted" style="margin-top:12px" id="sAuto">—</div>
    </div>

    <div class="card">
      <h2>未签到时自动重试</h2>
      <div class="toggle" id="tgHour">
        <div class="sw" id="swHour"></div>
        <div>
          <div><b>按间隔自动补签</b></div>
          <div class="muted">错过时段或电脑未开机时反复尝试，直到今日签到完成</div>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:9px">
        <span class="muted">重试间隔</span>
        <select id="selHour">
          <option value="0.5">30 分钟</option>
          <option value="1">1 小时</option>
          <option value="2">2 小时</option>
          <option value="3">3 小时</option>
          <option value="6">6 小时</option>
        </select>
      </div>
      <div class="muted" style="margin-top:12px" id="sHour">—</div>
    </div>

    <div class="card">
      <h2>登录 / 凭证</h2>
      <div class="row">
        <div class="name"><span class="dot" id="dTraeTok"></span><b>Trae</b></div>
        <div class="muted" id="sTraeTok">—</div>
      </div>
      <div class="row">
        <div class="name"><span class="dot" id="dWbTok"></span><b>WorkBuddy</b></div>
        <div class="muted" id="sWbTok">—</div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="btnWbLogin">WorkBuddy 登录授权</button>
      </div>
      <div class="auth" id="authBox">
        <div>请在浏览器打开下面的链接并确认授权（10 分钟内有效）：</div>
        <div style="margin:8px 0"><a id="authUrl" href="#" target="_blank"></a></div>
        <div class="muted" id="authState"><span class="spin"></span>等待授权中…</div>
      </div>
    </div>

    <div class="card" style="grid-column:1/-1">
      <h2>最近日志</h2>
      <pre class="log" id="log">加载中…</pre>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let scheduledTimes = [];
let pollTimer = null;

function toast(msg, kind) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
  clearTimeout(t._h); t._h = setTimeout(() => { t.className = 'toast ' + (kind || ''); }, 3600);
}
const fmtTime = (iso) => { if (!iso) return '—'; const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString('zh-CN', { hour12: false }); };
const fmtExp = (c, label) => {
  if (!c) return '未配置';
  if (c.daysLeft == null) return '已配置（无到期信息）';
  const d = c.daysLeft;
  const tag = d <= 0 ? '已过期' : (d < 3 ? '即将过期' : '有效');
  return tag + '，剩 ' + d.toFixed(1) + ' 天';
};

async function loadStatus() {
  const r = await fetch('/api/status').then(x => x.json()).catch(() => null);
  if (!r) { toast('无法连接后端', 'bad'); return; }
  $('sub').textContent = '更新于 ' + fmtTime(r.now) + (r.busy ? ' · 签到进行中…' : '');

  const t = r.today.trae, w = r.today.workbuddy;
  $('dTrae').className = 'dot ' + (t.ok ? 'ok' : 'no');
  $('sTrae').textContent = t.ok ? '已完成 ' + fmtTime(t.at) : '尚未完成';
  $('dWb').className = 'dot ' + (w.ok ? 'ok' : 'no');
  $('sWb').textContent = w.ok ? '已完成 ' + fmtTime(w.at) : '尚未完成';

  const lv = r.workbuddyLive;
  if (lv && lv.streakDays != null) { $('rowStreak').style.display = ''; $('sStreak').textContent = lv.streakDays + ' 天'; }
  else $('rowStreak').style.display = 'none';

  const c = r.credits;
  $('cTotal').innerHTML = (c.total || 0) + '<span>积分</span>';
  $('cWb').textContent = (c.workbuddy || 0) + ' 积分';
  $('cTrae').textContent = (c.trae || 0) + ' 积分';
  $('cDays').textContent = (c.days || 0) + ' 天';

  scheduledTimes = (r.schedule.times || []).slice();
  renderChips();
  $('schedInfo').textContent = '任务 ' + r.schedule.state + (r.schedule.next ? ' · 下次 ' + r.schedule.next : '')
    + (r.schedule.netTask ? ' · 断网补签已启用' : '');

  $('swAuto').className = 'sw' + (r.autostart ? ' on' : '');
  $('sAuto').textContent = r.autostart ? '已启用' : '未启用';

  const rr = r.hourly || {};
  $('swHour').className = 'sw' + (rr.enabled ? ' on' : '');
  if (document.activeElement !== $('selHour')) $('selHour').value = String(rr.hours || 1);
  const bothDone = t.ok && w.ok;
  $('sHour').textContent = rr.enabled
    ? ('已启用 · 每 ' + (rr.label || (rr.hours + ' 小时')) + ' 尝试一次'
       + (rr.next ? ' · 下次 ' + rr.next : '')
       + (bothDone ? '（今日已完成，会静默跳过）' : '（今日未完成，会继续重试）'))
    : '未启用';

  const ct = r.creds.trae, cw = r.creds.workbuddy;
  $('dTraeTok').className = 'dot ' + (ct ? 'ok' : 'no');
  $('sTraeTok').textContent = ct ? fmtExp(ct) + '（读取本机 Trae CN 客户端）' : '未找到，请先登录 Trae CN 客户端';
  $('dWbTok').className = 'dot ' + (cw ? 'ok' : 'no');
  $('sWbTok').textContent = cw ? fmtExp(cw) + (cw.hasRefresh ? '（可自动续期）' : '') : '未登录，请点击下方按钮授权';
  $('btnWbLogin').textContent = cw ? '重新授权' : 'WorkBuddy 登录授权';
}

function renderChips() {
  const box = $('chips'); box.innerHTML = '';
  if (!scheduledTimes.length) { box.innerHTML = '<span class="muted">尚未设置</span>'; return; }
  scheduledTimes.forEach((tm, i) => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = '<b>' + tm + '</b>';
    const b = document.createElement('button'); b.textContent = '×'; b.title = '移除';
    b.onclick = () => { scheduledTimes.splice(i, 1); renderChips(); };
    el.appendChild(b); box.appendChild(el);
  });
}

async function loadLog() {
  const r = await fetch('/api/log?lines=40').then(x => x.json()).catch(() => null);
  if (r && r.lines) $('log').textContent = r.lines.join('\n') || '（暂无日志）';
}

$('btnRefresh').onclick = async () => { await Promise.all([loadStatus(), loadLog()]); toast('已刷新', 'ok'); };

$('btnCheckin').onclick = async () => {
  const b = $('btnCheckin'); b.disabled = true; const old = b.textContent;
  b.innerHTML = '<span class="spin"></span>签到中…';
  try {
    const r = await fetch('/api/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(x => x.json());
    toast(r.ok ? '签到完成' : (r.busy ? r.message : '签到结束（可能有失败项，见日志）'), r.ok ? 'ok' : 'bad');
  } catch (e) { toast('请求失败：' + e.message, 'bad'); }
  b.disabled = false; b.textContent = old;
  await Promise.all([loadStatus(), loadLog()]);
};

$('btnAddTime').onclick = () => {
  const v = $('newTime').value;
  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) return toast('请选择合法时间', 'bad');
  if (scheduledTimes.includes(v)) return toast('该时间已存在', 'bad');
  scheduledTimes.push(v); scheduledTimes.sort(); renderChips();
};

$('btnSaveTime').onclick = async () => {
  const r = await fetch('/api/schedule', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ times: scheduledTimes }) }).then(x => x.json()).catch(() => null);
  if (r && r.ok) { toast('已保存，共 ' + scheduledTimes.length + ' 个时段', 'ok'); await loadStatus(); }
  else toast((r && r.message) || '保存失败', 'bad');
};

$('tgAuto').onclick = async () => {
  const on = !$('swAuto').classList.contains('on');
  $('swAuto').className = 'sw' + (on ? ' on' : '');
  const r = await fetch('/api/autostart', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: on }) }).then(x => x.json()).catch(() => null);
  if (r && r.ok) { toast(on ? '已开启开机自动补签' : '已关闭开机自动补签', 'ok'); await loadStatus(); }
  else { toast('设置失败', 'bad'); await loadStatus(); }
};

async function postHourly(enabled, hours) {
  return await fetch('/api/hourly', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: enabled, hours: hours }) }).then(x => x.json()).catch(() => null);
}
$('tgHour').onclick = async () => {
  const on = !$('swHour').classList.contains('on');
  $('swHour').className = 'sw' + (on ? ' on' : '');
  const r = await postHourly(on, Number($('selHour').value));
  if (r && r.ok) toast(on ? '已开启自动重试' : '已关闭自动重试', 'ok');
  else toast('设置失败', 'bad');
  await loadStatus();
};
$('selHour').onchange = async () => {
  const on = $('swHour').classList.contains('on');
  const r = await postHourly(on, Number($('selHour').value));
  if (r && r.ok) toast('重试间隔已更新', 'ok'); else toast('设置失败', 'bad');
  await loadStatus();
};

$('btnWbLogin').onclick = async () => {
  const r = await fetch('/api/wb-login/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
    .then(x => x.json()).catch(() => null);
  if (!r || !r.ok) return toast('发起授权失败', 'bad');
  $('authBox').classList.add('show');
  $('authUrl').textContent = r.authUrl; $('authUrl').href = r.authUrl;
  window.open(r.authUrl, '_blank');
  $('authState').innerHTML = '<span class="spin"></span>等待授权中…';
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const p = await fetch('/api/wb-login/poll').then(x => x.json()).catch(() => null);
    if (!p) return;
    if (p.done) {
      clearInterval(pollTimer);
      if (p.ok) { $('authState').textContent = '✅ 授权成功' + (p.nickname ? '（' + p.nickname + '）' : ''); toast('授权成功', 'ok'); }
      else { $('authState').textContent = '❌ ' + (p.message || '授权失败'); toast(p.message || '授权失败', 'bad'); }
      await loadStatus();
    }
  }, 2500);
};

(async () => { await Promise.all([loadStatus(), loadLog()]); setInterval(loadStatus, 30000); setInterval(loadLog, 30000); })();
</script>
</body>
</html>
